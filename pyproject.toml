[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aidecl"
version = "0.3.0"
description = "Validate AI Declaration (aidecl) files"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Faruk Diblen", email = "faruk.diblen@resoftlabs.com" }]
keywords = ["ai", "disclosure", "validation", "compliance", "transparency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.23",
    "referencing>=0.35",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/ai-declaration/cli"
Repository = "https://github.com/ai-declaration/cli"
"Bug Tracker" = "https://github.com/ai-declaration/cli/issues"
Documentation = "https://github.com/ai-declaration/cli#readme"

[project.scripts]
aidecl = "aidecl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aidecl = ["data/*.json", "data/*.sha256", "py.typed"]

[tool.pytest.ini_options]
# src layout, so the package is not importable from the repo root without this
pythonpath = ["src"]
testpaths = ["tests"]
